<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPT 生成测试页</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-2: #f8fafc;
        --line: #d8e0ea;
        --text: #162033;
        --muted: #64748b;
        --brand: #2563eb;
        --brand-2: #0f766e;
        --danger: #dc2626;
        --ok: #15803d;
        --shadow: 0 10px 30px rgba(18, 30, 56, 0.08);
        --radius: 10px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, #ffffff 0%, #f6f8fc 100%);
      }

      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.8);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .subtitle {
        color: var(--muted);
        font-size: 12px;
      }

      .shell {
        padding: 16px;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        flex: 1;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        padding: 12px 14px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 13px;
      }

      .panel-body { padding: 14px; }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
      }

      input, select, textarea, button {
        font: inherit;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(37, 99, 235, 0.55);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .compact {
        display: grid;
        grid-template-columns: 1fr 140px;
        gap: 10px;
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .button {
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
      }

      .button:active { transform: translateY(1px); }
      .button:disabled { opacity: 0.6; cursor: not-allowed; }

      .primary { background: var(--brand); color: #fff; }
      .secondary { background: #fff; border-color: var(--line); color: var(--text); }
      .ghost { background: #eef4ff; color: var(--brand); }

      .status {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        display: grid;
        gap: 8px;
      }

      .status-line {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .badge.ok { color: var(--ok); }
      .badge.err { color: var(--danger); }
      .badge.info { color: var(--brand); }

      .log {
        margin: 0;
        padding: 10px 12px;
        min-height: 92px;
        max-height: 180px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0b1220;
        color: #d9e6ff;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }

      .preview-wrap {
        display: grid;
        gap: 12px;
      }

      .preview-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .preview-box {
        border-top: 1px solid var(--line);
        background: #fff;
        min-height: 680px;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 680px;
        border: 0;
        background: #fff;
      }

      .small {
        font-size: 12px;
        color: var(--muted);
      }

      .theme-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .theme-list {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      .pill {
        padding: 4px 8px;
        border-radius: 999px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        font-size: 12px;
      }

      .link {
        color: var(--brand);
        text-decoration: none;
        word-break: break-all;
      }

      @media (max-width: 1024px) {
        .shell { grid-template-columns: 1fr; }
        .preview-box, iframe { min-height: 520px; }
      }

      @media (max-width: 640px) {
        .topbar { padding-inline: 14px; }
        .shell { padding: 12px; }
        .compact { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-row">
          <div>
            <h1>PPT 生成测试页</h1>
            <div class="subtitle">极简测试界面，直接调用 `/api/v1/ppt/generate`、`/jobs/{job_id}` 和 `/files/{job_id}`。</div>
          </div>
          <div class="row">
            <span class="badge info" id="connectionBadge">待连接</span>
            <span class="badge" id="jobBadge">Job: -</span>
          </div>
        </div>
      </header>

      <main class="shell">
        <section class="panel">
          <div class="panel-head">
            <h2>输入与操作</h2>
            <span class="small">状态会直接显示在下面</span>
          </div>
          <div class="panel-body">
            <div class="field">
              <label for="apiBase">API Base</label>
              <input id="apiBase" placeholder="例如 http://localhost:8000 或留空使用相对路径" />
            </div>

            <div class="field">
              <label for="feishuLoginUrl">飞书登录测试</label>
              <input id="feishuLoginUrl" placeholder="点击生成飞书授权 URL 后自动填充" />
            </div>

            <div class="field">
              <label for="feishuRedirectUri">redirect_uri（留空使用后端 .env 配置）</label>
              <input id="feishuRedirectUri" placeholder="必须与飞书开放平台后台配置完全一致" />
            </div>

            <div class="row">
              <button class="button secondary" id="loginUrlBtn">生成飞书登录 URL</button>
              <button class="button ghost" id="openLoginBtn">打开飞书授权</button>
            </div>

            <div class="compact">
              <div class="field">
                <label for="feishuCode">code</label>
                <input id="feishuCode" placeholder="飞书回跳后粘贴 code" />
              </div>
              <div class="field">
                <label for="feishuState">state</label>
                <input id="feishuState" placeholder="生成 URL 后自动填充" />
              </div>
            </div>

            <div class="row">
              <button class="button primary" id="exchangeLoginBtn">换取 JWT</button>
              <button class="button secondary" id="meBtn">调用 /auth/me</button>
            </div>

            <div class="field">
              <label for="sourceText">文本 / 聊天记录</label>
              <textarea id="sourceText" placeholder="请提供一段能看出多样布局的材料，明确要求封面、指标页、时间线、风险对比、行动总结等不同结构。"></textarea>
            </div>

            <div class="compact">
              <div class="field">
                <label for="themeSelect">风格</label>
                <select id="themeSelect">
                  <option value="business">business 商务风</option>
                  <option value="academic">academic 学术风</option>
                  <option value="apple_black">apple_black 苹果黑风</option>
                  <option value="apple_white" selected>apple_white 苹果白风</option>
                  <option value="eco">eco 绿色环保风</option>
                </select>
              </div>
              <div class="field">
                <label for="designModeSelect">design_mode</label>
                <select id="designModeSelect">
                  <option value="template" selected>template 模板</option>
                  <option value="free_design">free_design 自由设计</option>
                </select>
              </div>
            </div>

            <div class="compact">
              <div class="field">
                <label for="slidesLimit">page_count</label>
                <input id="slidesLimit" type="number" min="1" max="20" step="1" value="8" />
              </div>
              <div class="field">
                <label for="jobId">job_id</label>
                <input id="jobId" placeholder="生成后自动回填，也可手动查询已有任务" />
              </div>
            </div>

            <div class="field">
              <label for="designModesHint">后端生成模式</label>
              <div class="theme-hint" id="designModesHint">正在加载 /design-modes...</div>
              <div class="theme-list" id="designModesList"></div>
            </div>

            <div class="row">
              <button class="button primary" id="generateBtn">生成 PPT</button>
              <button class="button secondary" id="refreshBtn" disabled>刷新状态</button>
              <button class="button ghost" id="downloadBtn" disabled>打开文件</button>
            </div>

            <div class="status">
              <div class="status-line">
                <span class="badge" id="requestBadge">空闲</span>
                <span class="badge" id="styleBadge">风格: -</span>
                <span class="badge" id="designModeBadge">design_mode: template</span>
                <span class="badge" id="slidesBadge">page_count: 8</span>
              </div>
              <div class="log" id="logBox">等待操作。</div>
              <div class="small" id="jobInfo"></div>
            </div>
          </div>
        </section>

        <section class="panel preview-wrap">
          <div class="panel-head">
            <h2>任务状态与下载</h2>
            <div class="preview-toolbar">
              <span class="small">轮询 /jobs/{job_id}，完成后打开 /files/{job_id}</span>
            </div>
          </div>
          <div class="panel-body" id="jobSummary">
            <div class="small">等待生成任务或手动输入 job_id 后刷新状态。</div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const els = {
        apiBase: document.getElementById("apiBase"),
        feishuLoginUrl: document.getElementById("feishuLoginUrl"),
        feishuRedirectUri: document.getElementById("feishuRedirectUri"),
        feishuCode: document.getElementById("feishuCode"),
        feishuState: document.getElementById("feishuState"),
        sourceText: document.getElementById("sourceText"),
        themeSelect: document.getElementById("themeSelect"),
        designModeSelect: document.getElementById("designModeSelect"),
        slidesLimit: document.getElementById("slidesLimit"),
        jobId: document.getElementById("jobId"),
        designModesHint: document.getElementById("designModesHint"),
        designModesList: document.getElementById("designModesList"),
        requestBadge: document.getElementById("requestBadge"),
        connectionBadge: document.getElementById("connectionBadge"),
        styleBadge: document.getElementById("styleBadge"),
        designModeBadge: document.getElementById("designModeBadge"),
        slidesBadge: document.getElementById("slidesBadge"),
        jobBadge: document.getElementById("jobBadge"),
        logBox: document.getElementById("logBox"),
        jobInfo: document.getElementById("jobInfo"),
        jobSummary: document.getElementById("jobSummary"),
        generateBtn: document.getElementById("generateBtn"),
        refreshBtn: document.getElementById("refreshBtn"),
        downloadBtn: document.getElementById("downloadBtn"),
        loginUrlBtn: document.getElementById("loginUrlBtn"),
        openLoginBtn: document.getElementById("openLoginBtn"),
        exchangeLoginBtn: document.getElementById("exchangeLoginBtn"),
        meBtn: document.getElementById("meBtn"),
      };

      const state = {
        jobId: "",
        job: null,
        designModes: [],
        pollTimer: null,
      };

      const storageKey = "eko-ppt-test-api-base";
      const authTokenKey = "eko-access-token";
      const oauthStateKey = "eko-feishu-oauth-state";
      const oauthRedirectKey = "eko-feishu-redirect-uri";
      const defaultBase = window.location.protocol === "file:"
        ? "http://localhost:8000"
        : (window.location.origin && window.location.origin !== "null" ? window.location.origin : "http://localhost:8000");

      els.apiBase.value = localStorage.getItem(storageKey) || defaultBase;
      els.feishuState.value = localStorage.getItem(oauthStateKey) || "";
      els.feishuRedirectUri.value = localStorage.getItem(oauthRedirectKey) || "";

      const callbackParams = new URLSearchParams(window.location.search);
      if (callbackParams.get("code")) {
        els.feishuCode.value = callbackParams.get("code");
      }
      if (callbackParams.get("state")) {
        els.feishuState.value = callbackParams.get("state");
      }

      function normalizeBase(base) {
        const raw = (base || "").trim();
        if (!raw) return "";
        return raw.replace(/\/+$/, "");
      }

      function apiUrl(path) {
        const base = normalizeBase(els.apiBase.value);
        return base ? `${base}${path}` : path;
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setRequestState(text, kind = "info") {
        els.requestBadge.textContent = text;
        els.requestBadge.className = `badge ${kind === "error" ? "err" : kind === "ok" ? "ok" : "info"}`;
      }

      function setConnectionState(text, kind = "info") {
        els.connectionBadge.textContent = text;
        els.connectionBadge.className = `badge ${kind === "error" ? "err" : kind === "ok" ? "ok" : "info"}`;
      }

      function log(message, extra) {
        const stamp = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        const lines = [`[${stamp}] ${message}`];
        if (extra !== undefined) {
          if (typeof extra === "string") lines.push(extra);
          else lines.push(JSON.stringify(extra, null, 2));
        }
        els.logBox.textContent = lines.join("\n");
      }

      async function requestJson(path, options = {}) {
        const token = localStorage.getItem(authTokenKey);
        const response = await fetch(apiUrl(path), {
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...(options.headers || {}),
          },
          ...options,
        });
        const text = await response.text();
        let body;
        try {
          body = text ? JSON.parse(text) : {};
        } catch (error) {
          throw new Error(`响应不是合法 JSON：${text.slice(0, 300)}`);
        }
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText || "请求失败"}`);
        }
        if (typeof body !== "object" || body === null) {
          throw new Error("响应结构不正确");
        }
        if (typeof body.code !== "undefined" && body.code !== 0) {
          throw new Error(body.message || `API 返回错误 code=${body.code}`);
        }
        return body;
      }

      function pickJobId(data) {
        if (!data || typeof data !== "object") return "";
        return data.job_id || data.jobId || data.id || "";
      }

      function pickDownloadUrl(data) {
        if (!data || typeof data !== "object") return "";
        return data.download_url || data.downloadUrl || "";
      }

      function resolveHref(url) {
        if (!url) return "";
        return /^https?:\/\//i.test(url) ? url : apiUrl(url);
      }

      function renderDesignModes(modes) {
        els.designModesList.innerHTML = "";
        if (!modes.length) {
          els.designModesHint.textContent = "后端没有返回生成模式，继续使用下拉框中的固定选项。";
          return;
        }
        els.designModesHint.textContent = "后端 design-modes：";
        modes.forEach((item) => {
          const span = document.createElement("span");
          span.className = "pill";
          if (typeof item === "string") {
            span.textContent = item;
          } else {
            span.textContent = [item.mode, item.label].filter(Boolean).join(" ");
          }
          els.designModesList.appendChild(span);
        });
      }

      function renderJobSummary(job) {
        if (!job) {
          els.jobSummary.innerHTML = '<div class="small">等待生成任务或手动输入 job_id 后刷新状态。</div>';
          return;
        }
        const rows = [
          ["job_id", job.job_id],
          ["status", job.status],
          ["progress", `${job.progress}%`],
          ["current_step", job.current_step],
          ["source_type", job.source_type],
          ["source_name", job.source_name || "-"],
          ["page_count", job.page_count],
          ["style", job.style],
          ["design_mode", job.design_mode],
          ["download_url", job.download_url || "-"],
          ["error", job.error || "-"],
          ["created_at", job.created_at],
          ["updated_at", job.updated_at],
        ];
        els.jobSummary.innerHTML = rows.map(([label, value]) => `
          <div class="status-line" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;">
            <span class="small" style="min-width:120px;">${escapeHtml(label)}</span>
            <span style="text-align:right;word-break:break-all;">${escapeHtml(value == null ? "-" : String(value))}</span>
          </div>
        `).join("");
      }

      function renderJobInfo(job) {
        if (!job) {
          els.jobInfo.textContent = "";
          return;
        }
        const downloadUrl = pickDownloadUrl(job);
        els.jobInfo.innerHTML = downloadUrl
          ? `下载链接：<a class="link" href="${escapeHtml(resolveHref(downloadUrl))}" target="_blank" rel="noreferrer">${escapeHtml(downloadUrl)}</a>`
          : "下载链接：等待任务完成后生成。";
      }

      function syncMeta() {
        const style = els.themeSelect.value || "-";
        const designMode = els.designModeSelect.value || "-";
        els.styleBadge.textContent = `风格: ${style}`;
        els.designModeBadge.textContent = `design_mode: ${designMode}`;
        els.slidesBadge.textContent = `page_count: ${els.slidesLimit.value || "-"}`;
        els.jobBadge.textContent = `Job: ${state.jobId || "-"}`;
        els.refreshBtn.disabled = !state.jobId;
        els.downloadBtn.disabled = !pickDownloadUrl(state.job);
      }

      function applyJob(job) {
        state.job = job || null;
        const jobId = pickJobId(job);
        if (jobId) {
          state.jobId = jobId;
          els.jobId.value = jobId;
        }
        renderJobSummary(state.job);
        renderJobInfo(state.job);
        syncMeta();
      }

      async function getFeishuLoginUrl() {
        setRequestState("生成登录 URL...", "info");
        try {
          const redirectUri = els.feishuRedirectUri.value.trim();
          const query = redirectUri ? `?redirect_uri=${encodeURIComponent(redirectUri)}` : "";
          if (redirectUri) {
            localStorage.setItem(oauthRedirectKey, redirectUri);
          } else {
            localStorage.removeItem(oauthRedirectKey);
          }
          const payload = await requestJson(`/api/v1/auth/feishu/login-url${query}`);
          els.feishuLoginUrl.value = payload.data.authorize_url;
          els.feishuState.value = payload.data.state;
          localStorage.setItem(oauthStateKey, payload.data.state);
          setRequestState("登录 URL 已生成", "ok");
          log("飞书登录 URL 已生成", payload.data);
        } catch (error) {
          setRequestState("登录 URL 失败", "error");
          log(error.message);
        }
      }

      function openFeishuLogin() {
        const url = els.feishuLoginUrl.value.trim();
        if (!url) {
          log("请先生成飞书登录 URL");
          return;
        }
        window.open(url, "_blank", "noopener,noreferrer");
      }

      async function exchangeFeishuCode() {
        setRequestState("换取 JWT...", "info");
        try {
          const code = els.feishuCode.value.trim();
          const stateValue = els.feishuState.value.trim();
          const payload = await requestJson("/api/v1/auth/feishu/login", {
            method: "POST",
            body: JSON.stringify({ code, state: stateValue }),
          });
          localStorage.setItem(authTokenKey, payload.data.access_token);
          setRequestState("登录成功", "ok");
          log("飞书登录成功，JWT 已保存到 localStorage", payload.data.user);
        } catch (error) {
          setRequestState("登录失败", "error");
          log(error.message);
        }
      }

      async function loadCurrentUser() {
        setRequestState("读取 /auth/me...", "info");
        try {
          const payload = await requestJson("/api/v1/auth/me");
          setRequestState("/auth/me 成功", "ok");
          log("当前登录用户", payload.data);
        } catch (error) {
          setRequestState("/auth/me 失败", "error");
          log(error.message);
        }
      }

      async function loadDesignModes() {
        try {
          const body = await requestJson("/api/v1/ppt/design-modes", { method: "GET" });
          const modes = Array.isArray(body.data) ? body.data : [];
          state.designModes = modes;
          renderDesignModes(modes);
          setConnectionState("design-modes 已加载", "ok");
          log("已加载 design-modes", modes);
        } catch (error) {
          els.designModesHint.textContent = "design-modes 加载失败，界面仍可继续测试生成/状态/下载。";
          setConnectionState("design-modes 加载失败", "error");
          log("加载 design-modes 失败", String(error.message || error));
        }
      }

      function syncLocalSettings() {
        localStorage.setItem(storageKey, els.apiBase.value);
        syncMeta();
      }

      function stopPolling() {
        if (state.pollTimer) {
          window.clearInterval(state.pollTimer);
          state.pollTimer = null;
        }
      }

      function startPolling() {
        stopPolling();
        state.pollTimer = window.setInterval(() => {
          if (!state.jobId) {
            stopPolling();
            return;
          }
          refreshJobStatus({ quiet: true });
        }, 3000);
      }

      async function generatePpt() {
        syncLocalSettings();
        setRequestState("生成中...", "info");
        els.generateBtn.disabled = true;
        try {
          const text = els.sourceText.value.trim();
          const style = els.themeSelect.value;
          const designMode = els.designModeSelect.value;
          const pageCount = Number(els.slidesLimit.value || 0);
          const payload = {
            topic: text,
            page_count: pageCount,
            style,
            design_mode: designMode,
          };
          const body = await requestJson("/api/v1/ppt/generate", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          applyJob(body.data || {});
          setRequestState("任务已创建", "ok");
          log("生成成功", body);
          startPolling();
          await refreshJobStatus({ quiet: true });
        } catch (error) {
          setRequestState("生成失败", "error");
          log("生成失败", String(error.message || error));
        } finally {
          els.generateBtn.disabled = false;
          syncMeta();
        }
      }

      async function refreshJobStatus(options = {}) {
        syncLocalSettings();
        const quiet = Boolean(options.quiet);
        const jobId = (els.jobId.value || state.jobId || "").trim();
        if (!jobId) {
          if (!quiet) {
            setRequestState("缺少 job_id", "error");
            log("刷新失败：请先生成任务或手动填写 job_id");
          }
          return;
        }
        if (!quiet) {
          setRequestState("查询中...", "info");
        }
        els.refreshBtn.disabled = true;
        try {
          const body = await requestJson(`/api/v1/ppt/jobs/${encodeURIComponent(jobId)}`, { method: "GET" });
          applyJob(body.data || {});
          if (!quiet) {
            setRequestState("状态已更新", "ok");
            log("任务状态", body);
          }
          if (state.job?.status === "done" || state.job?.status === "failed") {
            stopPolling();
          }
        } catch (error) {
          if (!quiet) {
            setRequestState("刷新失败", "error");
            log("刷新失败", String(error.message || error));
          }
        } finally {
          syncMeta();
        }
      }

      function openDownload() {
        const downloadUrl = pickDownloadUrl(state.job);
        const jobId = (state.jobId || els.jobId.value || "").trim();
        if (downloadUrl) {
          window.open(resolveHref(downloadUrl), "_blank", "noopener,noreferrer");
          return;
        }
        if (jobId) {
          window.open(apiUrl(`/api/v1/ppt/files/${encodeURIComponent(jobId)}`), "_blank", "noopener,noreferrer");
        }
      }

      els.apiBase.addEventListener("change", syncLocalSettings);
      els.themeSelect.addEventListener("change", syncMeta);
      els.designModeSelect.addEventListener("change", syncMeta);
      els.slidesLimit.addEventListener("input", syncMeta);
      els.jobId.addEventListener("input", () => {
        state.jobId = els.jobId.value.trim();
        syncMeta();
      });

      els.generateBtn.addEventListener("click", generatePpt);
      els.refreshBtn.addEventListener("click", () => refreshJobStatus());
      els.downloadBtn.addEventListener("click", openDownload);
      els.loginUrlBtn.addEventListener("click", getFeishuLoginUrl);
      els.openLoginBtn.addEventListener("click", openFeishuLogin);
      els.exchangeLoginBtn.addEventListener("click", exchangeFeishuCode);
      els.meBtn.addEventListener("click", loadCurrentUser);

      els.sourceText.value = `试验版 AIPPT 联测材料
请优先覆盖这些新版结构：
1. 章节页 / section_divider：每个章节开头单独分页，标题要简短有力。
2. 金句页 / quote：用一句最能代表章节结论的话做强记忆点。
3. 流程页 / process：把步骤、阶段、输入输出串起来，适合 3-5 步。
4. 四象限 / matrix：用 2x2 结构表达优先级、分类或判断框架。
5. 架构模块 / architecture：拆成上中下或左右模块，展示系统、链路、组件关系。
6. 对比页 / comparison：并列比较两个方案、版本或策略，左右差异要一眼可见。
7. 指标页 / metrics：展示 3-4 个核心 KPI，数字要醒目。
8. 时间线 / timeline：按时间顺序写里程碑、交付节奏和截止日期。
要求：至少 8 页，尽量覆盖 section_divider、quote、process、matrix、architecture、comparison、metrics、timeline 这些结构差异。`;
      els.themeSelect.value = "apple_white";
      els.designModeSelect.value = "template";
      els.slidesLimit.value = "8";
      els.jobId.value = "";
      state.jobId = "";
      state.job = null;
      renderJobSummary(null);
      renderJobInfo(null);
      syncMeta();
      setRequestState("空闲", "info");
      loadDesignModes();
    </script>
  </body>
</html>
