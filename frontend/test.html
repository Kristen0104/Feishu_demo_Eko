<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eko 测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .chat-box { border: 1px solid #ddd; border-radius: 8px; height: 400px; overflow-y: auto; padding: 16px; margin-bottom: 16px; background: #fafafa; }
        .msg { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .msg.user { background: #007aff; color: white; margin-left: auto; }
        .msg.assistant { background: #e9e9e9; color: #333; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 12px 24px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; }
        .status { color: #666; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>Eko 测试页面</h1>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
    <div class="status" id="status"></div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        const SESSION_ID = 'test-session';
        // 临时 token（测试用）
        const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LXVzZXItaWQiLCJleHAiOjE3Nzc2MjA5MzZ9.yMHy_cUuueu5fKPc8IFv7i4m5oL2uf3Ml4I-QY5Pp-E';

        function addMsg(content, type) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;

            addMsg(msg, 'user');
            input.value = '';
            btn.disabled = true;
            document.getElementById('status').textContent = '等待回复...';

            try {
                const res = await fetch(`${API_BASE}/agent/execute`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: SESSION_ID,
                        message: msg,
                        stream: false
                    })
                });
                const data = await res.json();
                if (data.result) {
                    addMsg(data.result, 'assistant');
                } else {
                    addMsg('错误: ' + JSON.stringify(data), 'assistant');
                }
            } catch (e) {
                addMsg('请求失败: ' + e.message, 'assistant');
            }

            btn.disabled = false;
            document.getElementById('status').textContent = '';
        }
    </script>
</body>
</html>
