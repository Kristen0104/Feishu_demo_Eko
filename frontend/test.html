<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPT 生成测试页</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-2: #f8fafc;
        --line: #d8e0ea;
        --text: #162033;
        --muted: #64748b;
        --brand: #2563eb;
        --brand-2: #0f766e;
        --danger: #dc2626;
        --ok: #15803d;
        --shadow: 0 10px 30px rgba(18, 30, 56, 0.08);
        --radius: 10px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, #ffffff 0%, #f6f8fc 100%);
      }

      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.8);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .subtitle {
        color: var(--muted);
        font-size: 12px;
      }

      .shell {
        padding: 16px;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        flex: 1;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        padding: 12px 14px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 13px;
      }

      .panel-body { padding: 14px; }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
      }

      input, select, textarea, button {
        font: inherit;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(37, 99, 235, 0.55);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .compact {
        display: grid;
        grid-template-columns: 1fr 140px;
        gap: 10px;
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .button {
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
      }

      .button:active { transform: translateY(1px); }
      .button:disabled { opacity: 0.6; cursor: not-allowed; }

      .primary { background: var(--brand); color: #fff; }
      .secondary { background: #fff; border-color: var(--line); color: var(--text); }
      .ghost { background: #eef4ff; color: var(--brand); }

      .status {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        display: grid;
        gap: 8px;
      }

      .status-line {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .badge.ok { color: var(--ok); }
      .badge.err { color: var(--danger); }
      .badge.info { color: var(--brand); }

      .log {
        margin: 0;
        padding: 10px 12px;
        min-height: 92px;
        max-height: 180px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0b1220;
        color: #d9e6ff;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }

      .preview-wrap {
        display: grid;
        gap: 12px;
      }

      .preview-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .preview-box {
        border-top: 1px solid var(--line);
        background: #fff;
        min-height: 680px;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 680px;
        border: 0;
        background: #fff;
      }

      .small {
        font-size: 12px;
        color: var(--muted);
      }

      .theme-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .theme-list {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      .pill {
        padding: 4px 8px;
        border-radius: 999px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        font-size: 12px;
      }

      .link {
        color: var(--brand);
        text-decoration: none;
        word-break: break-all;
      }

      @media (max-width: 1024px) {
        .shell { grid-template-columns: 1fr; }
        .preview-box, iframe { min-height: 520px; }
      }

      @media (max-width: 640px) {
        .topbar { padding-inline: 14px; }
        .shell { padding: 12px; }
        .compact { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-row">
          <div>
            <h1>PPT 生成测试页</h1>
            <div class="subtitle">极简测试界面，直接调用 `/api/v1/ppt/decks`、`/modify`、`/export` 和 `/themes`。</div>
          </div>
          <div class="row">
            <span class="badge info" id="connectionBadge">待连接</span>
            <span class="badge" id="deckBadge">Deck: -</span>
          </div>
        </div>
      </header>

      <main class="shell">
        <section class="panel">
          <div class="panel-head">
            <h2>输入与操作</h2>
            <span class="small">状态会直接显示在下面</span>
          </div>
          <div class="panel-body">
            <div class="field">
              <label for="apiBase">API Base</label>
              <input id="apiBase" placeholder="例如 http://localhost:8000 或留空使用相对路径" />
            </div>

            <div class="field">
              <label for="feishuLoginUrl">飞书登录测试</label>
              <input id="feishuLoginUrl" placeholder="点击生成飞书授权 URL 后自动填充" />
            </div>

            <div class="field">
              <label for="feishuRedirectUri">redirect_uri（留空使用后端 .env 配置）</label>
              <input id="feishuRedirectUri" placeholder="必须与飞书开放平台后台配置完全一致" />
            </div>

            <div class="row">
              <button class="button secondary" id="loginUrlBtn">生成飞书登录 URL</button>
              <button class="button ghost" id="openLoginBtn">打开飞书授权</button>
            </div>

            <div class="compact">
              <div class="field">
                <label for="feishuCode">code</label>
                <input id="feishuCode" placeholder="飞书回跳后粘贴 code" />
              </div>
              <div class="field">
                <label for="feishuState">state</label>
                <input id="feishuState" placeholder="生成 URL 后自动填充" />
              </div>
            </div>

            <div class="row">
              <button class="button primary" id="exchangeLoginBtn">换取 JWT</button>
              <button class="button secondary" id="meBtn">调用 /auth/me</button>
            </div>

            <div class="field">
              <label for="sourceText">文本 / 聊天记录</label>
              <textarea id="sourceText" placeholder="请提供一段能看出多样布局的材料，明确要求封面、指标页、时间线、风险对比、行动总结等不同结构。"></textarea>
            </div>

            <div class="compact">
              <div class="field">
                <label for="themeSelect">主题</label>
                <select id="themeSelect">
                  <option value="business">business 商务风</option>
                  <option value="academic">academic 学术风</option>
                  <option value="apple_black">apple_black 苹果黑风</option>
                  <option value="apple_white" selected>apple_white 苹果白风</option>
                  <option value="eco">eco 绿色环保风</option>
                </select>
              </div>
              <div class="field">
                <label for="slidesLimit">slides_limit</label>
                <input id="slidesLimit" type="number" min="1" max="100" step="1" value="8" />
              </div>
            </div>

            <div class="field">
              <label for="modifyText">自然语言修改</label>
              <textarea id="modifyText" placeholder="例如：把前 3 页改成更商务一些，减少长句。"></textarea>
            </div>

            <div class="compact">
              <div class="field">
                <label for="slideId">slide_id</label>
                <input id="slideId" placeholder="可选，例如 1 / intro / slide-3" />
              </div>
              <div class="field">
                <label for="deckId">deck_id</label>
                <input id="deckId" placeholder="生成后自动回填" />
              </div>
            </div>

            <div class="field">
              <label for="themesHint">后端主题列表</label>
              <div class="theme-hint" id="themesHint">正在加载 themes...</div>
              <div class="theme-list" id="themeList"></div>
            </div>

            <div class="row">
              <button class="button primary" id="generateBtn">生成 PPT</button>
              <button class="button secondary" id="modifyBtn" disabled>修改并刷新</button>
              <button class="button ghost" id="exportBtn" disabled>导出</button>
            </div>

            <div class="status">
              <div class="status-line">
                <span class="badge" id="requestBadge">空闲</span>
                <span class="badge" id="themeBadge">主题: -</span>
                <span class="badge" id="slidesBadge">slides_limit: 8</span>
              </div>
              <div class="log" id="logBox">等待操作。</div>
              <div class="small" id="exportInfo"></div>
            </div>
          </div>
        </section>

        <section class="panel preview-wrap">
          <div class="panel-head">
            <h2>HTML PPT 预览</h2>
            <div class="preview-toolbar">
              <span class="small">直接渲染后端返回的 HTML</span>
            </div>
          </div>
          <div class="preview-box">
            <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
          </div>
        </section>
      </main>
    </div>

    <script>
      const els = {
        apiBase: document.getElementById("apiBase"),
        feishuLoginUrl: document.getElementById("feishuLoginUrl"),
        feishuRedirectUri: document.getElementById("feishuRedirectUri"),
        feishuCode: document.getElementById("feishuCode"),
        feishuState: document.getElementById("feishuState"),
        sourceText: document.getElementById("sourceText"),
        themeSelect: document.getElementById("themeSelect"),
        slidesLimit: document.getElementById("slidesLimit"),
        modifyText: document.getElementById("modifyText"),
        slideId: document.getElementById("slideId"),
        deckId: document.getElementById("deckId"),
        themesHint: document.getElementById("themesHint"),
        themeList: document.getElementById("themeList"),
        requestBadge: document.getElementById("requestBadge"),
        connectionBadge: document.getElementById("connectionBadge"),
        themeBadge: document.getElementById("themeBadge"),
        slidesBadge: document.getElementById("slidesBadge"),
        deckBadge: document.getElementById("deckBadge"),
        logBox: document.getElementById("logBox"),
        previewFrame: document.getElementById("previewFrame"),
        exportInfo: document.getElementById("exportInfo"),
        generateBtn: document.getElementById("generateBtn"),
        modifyBtn: document.getElementById("modifyBtn"),
        exportBtn: document.getElementById("exportBtn"),
        loginUrlBtn: document.getElementById("loginUrlBtn"),
        openLoginBtn: document.getElementById("openLoginBtn"),
        exchangeLoginBtn: document.getElementById("exchangeLoginBtn"),
        meBtn: document.getElementById("meBtn"),
      };

      const state = {
        html: "",
        deckId: "",
        exportResult: null,
        themes: [],
      };

      const storageKey = "eko-ppt-test-api-base";
      const authTokenKey = "eko-access-token";
      const oauthStateKey = "eko-feishu-oauth-state";
      const oauthRedirectKey = "eko-feishu-redirect-uri";
      const defaultBase = window.location.protocol === "file:"
        ? "http://localhost:8000"
        : (window.location.origin && window.location.origin !== "null" ? window.location.origin : "http://localhost:8000");
      els.apiBase.value = localStorage.getItem(storageKey) || defaultBase;
      els.feishuState.value = localStorage.getItem(oauthStateKey) || "";
      els.feishuRedirectUri.value = localStorage.getItem(oauthRedirectKey) || "";

      const callbackParams = new URLSearchParams(window.location.search);
      if (callbackParams.get("code")) {
        els.feishuCode.value = callbackParams.get("code");
      }
      if (callbackParams.get("state")) {
        els.feishuState.value = callbackParams.get("state");
      }

      function normalizeBase(base) {
        const raw = (base || "").trim();
        if (!raw) return "";
        return raw.replace(/\/+$/, "");
      }

      function apiUrl(path) {
        const base = normalizeBase(els.apiBase.value);
        return base ? `${base}${path}` : path;
      }

      function setRequestState(text, kind = "info") {
        els.requestBadge.textContent = text;
        els.requestBadge.className = `badge ${kind === "error" ? "err" : kind === "ok" ? "ok" : "info"}`;
      }

      function setConnectionState(text, kind = "info") {
        els.connectionBadge.textContent = text;
        els.connectionBadge.className = `badge ${kind === "error" ? "err" : kind === "ok" ? "ok" : "info"}`;
      }

      function log(message, extra) {
        const stamp = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        const lines = [`[${stamp}] ${message}`];
        if (extra !== undefined) {
          if (typeof extra === "string") lines.push(extra);
          else lines.push(JSON.stringify(extra, null, 2));
        }
        els.logBox.textContent = lines.join("\n");
      }

      function setPreview(html) {
        state.html = html || "";
        els.previewFrame.srcdoc = state.html || "<!doctype html><html><body style='font-family:system-ui;padding:24px;color:#64748b;'>等待后端返回 HTML...</body></html>";
      }

      function updateMeta() {
        const theme = els.themeSelect.value || "-";
        els.themeBadge.textContent = `主题: ${theme}`;
        els.slidesBadge.textContent = `slides_limit: ${els.slidesLimit.value || "-"}`;
        els.deckBadge.textContent = `Deck: ${state.deckId || "-"}`;
        els.modifyBtn.disabled = !state.deckId;
        els.exportBtn.disabled = !state.deckId;
      }

      function pickHtml(data) {
        if (!data || typeof data !== "object") return "";
        return (
          data.html ||
          data.preview_html ||
          data.deck_html ||
          data.content ||
          data.rendered_html ||
          data.preview ||
          data.deck?.html ||
          data.result?.html ||
          ""
        );
      }

      function pickDeckId(data) {
        if (!data || typeof data !== "object") return "";
        return data.deck_id || data.deckId || data.id || data.deck?.id || "";
      }

      function pickExport(data) {
        if (!data || typeof data !== "object") return null;
        return {
          path: data.path || data.export_path || data.file_path || "",
          url: data.url || data.export_url || data.download_url || "",
          raw: data,
        };
      }

      function safeText(value) {
        return escapeHtml(value == null ? "" : String(value));
      }

      async function requestJson(path, options = {}) {
        const token = localStorage.getItem(authTokenKey);
        const response = await fetch(apiUrl(path), {
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...(options.headers || {}),
          },
          ...options,
        });
        const text = await response.text();
        let body;
        try {
          body = text ? JSON.parse(text) : {};
        } catch (error) {
          throw new Error(`响应不是合法 JSON：${text.slice(0, 300)}`);
        }
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText || "请求失败"}`);
        }
        if (typeof body !== "object" || body === null) {
          throw new Error("响应结构不正确");
        }
        if (typeof body.code !== "undefined" && body.code !== 0) {
          throw new Error(body.message || `API 返回错误 code=${body.code}`);
        }
        return body;
      }

      async function getFeishuLoginUrl() {
        setRequestState("生成登录 URL...", "info");
        try {
          const redirectUri = els.feishuRedirectUri.value.trim();
          const query = redirectUri ? `?redirect_uri=${encodeURIComponent(redirectUri)}` : "";
          if (redirectUri) {
            localStorage.setItem(oauthRedirectKey, redirectUri);
          } else {
            localStorage.removeItem(oauthRedirectKey);
          }
          const payload = await requestJson(`/api/v1/auth/feishu/login-url${query}`);
          els.feishuLoginUrl.value = payload.data.authorize_url;
          els.feishuState.value = payload.data.state;
          localStorage.setItem(oauthStateKey, payload.data.state);
          setRequestState("登录 URL 已生成", "ok");
          log("飞书登录 URL 已生成", payload.data);
        } catch (error) {
          setRequestState("登录 URL 失败", "error");
          log(error.message);
        }
      }

      function openFeishuLogin() {
        const url = els.feishuLoginUrl.value.trim();
        if (!url) {
          log("请先生成飞书登录 URL");
          return;
        }
        window.open(url, "_blank", "noopener,noreferrer");
      }

      async function exchangeFeishuCode() {
        setRequestState("换取 JWT...", "info");
        try {
          const code = els.feishuCode.value.trim();
          const stateValue = els.feishuState.value.trim();
          const payload = await requestJson("/api/v1/auth/feishu/login", {
            method: "POST",
            body: JSON.stringify({ code, state: stateValue }),
          });
          localStorage.setItem(authTokenKey, payload.data.access_token);
          setRequestState("登录成功", "ok");
          log("飞书登录成功，JWT 已保存到 localStorage", payload.data.user);
        } catch (error) {
          setRequestState("登录失败", "error");
          log(error.message);
        }
      }

      async function loadCurrentUser() {
        setRequestState("读取 /auth/me...", "info");
        try {
          const payload = await requestJson("/api/v1/auth/me");
          setRequestState("/auth/me 成功", "ok");
          log("当前登录用户", payload.data);
        } catch (error) {
          setRequestState("/auth/me 失败", "error");
          log(error.message);
        }
      }

      function renderThemes(themes) {
        els.themeList.innerHTML = "";
        if (!themes.length) {
          els.themesHint.textContent = "后端没有返回主题列表，继续使用上面的固定选项。";
          return;
        }
        els.themesHint.textContent = "后端 themes：";
        themes.forEach((item) => {
          const span = document.createElement("span");
          span.className = "pill";
          span.textContent = typeof item === "string" ? item : (item.name || item.label || item.id || JSON.stringify(item));
          els.themeList.appendChild(span);
        });
      }

      async function loadThemes() {
        try {
          const body = await requestJson("/api/v1/ppt/themes", { method: "GET" });
          const data = body.data;
          const themes = Array.isArray(data) ? data : Array.isArray(data?.themes) ? data.themes : [];
          state.themes = themes;
          renderThemes(themes);
          setConnectionState("themes 已加载", "ok");
          log("已加载 themes", themes);
        } catch (error) {
          els.themesHint.textContent = "themes 加载失败，界面仍可继续测试生成/修改/导出。";
          setConnectionState("themes 加载失败", "error");
          log("加载 themes 失败", String(error.message || error));
        }
      }

      function syncLocalSettings() {
        localStorage.setItem(storageKey, els.apiBase.value);
        updateMeta();
      }

      async function generateDeck() {
        syncLocalSettings();
        setRequestState("生成中...", "info");
        els.generateBtn.disabled = true;
        try {
          const text = els.sourceText.value.trim();
          const theme = els.themeSelect.value;
          const slidesLimit = Number(els.slidesLimit.value || 0);
          const payload = {
            type: "chat_record",
            content: text,
            preferences: {
              theme,
              slides_limit: slidesLimit,
            },
          };
          const body = await requestJson("/api/v1/ppt/decks", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const data = body.data || {};
          const html = pickHtml(data);
          const deckId = pickDeckId(data);
          if (deckId) {
            state.deckId = deckId;
            els.deckId.value = deckId;
          }
          if (html) setPreview(html);
          els.exportInfo.textContent = "";
          setRequestState("生成成功", "ok");
          log("生成成功", body);
        } catch (error) {
          setRequestState("生成失败", "error");
          log("生成失败", String(error.message || error));
        } finally {
          els.generateBtn.disabled = false;
          updateMeta();
        }
      }

      async function modifyDeck() {
        syncLocalSettings();
        const deckId = (els.deckId.value || state.deckId || "").trim();
        if (!deckId) {
          setRequestState("缺少 deck_id", "error");
          log("修改失败：请先生成 deck 或手动填写 deck_id");
          return;
        }
        setRequestState("修改中...", "info");
        els.modifyBtn.disabled = true;
        try {
          const instruction = els.modifyText.value.trim();
          const slideId = els.slideId.value.trim();
          const payload = {
            instruction,
            prompt: instruction,
            natural_language: instruction,
            text: instruction,
            slide_id: slideId || undefined,
            slideId: slideId || undefined,
          };
          const body = await requestJson(`/api/v1/ppt/decks/${encodeURIComponent(deckId)}/modify`, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          const data = body.data || {};
          const html = pickHtml(data);
          if (html) setPreview(html);
          const nextDeckId = pickDeckId(data);
          if (nextDeckId) {
            state.deckId = nextDeckId;
            els.deckId.value = nextDeckId;
          }
          setRequestState("修改成功", "ok");
          log("修改成功", body);
        } catch (error) {
          setRequestState("修改失败", "error");
          log("修改失败", String(error.message || error));
        } finally {
          els.modifyBtn.disabled = false;
          updateMeta();
        }
      }

      async function exportDeck() {
        syncLocalSettings();
        const deckId = (els.deckId.value || state.deckId || "").trim();
        if (!deckId) {
          setRequestState("缺少 deck_id", "error");
          log("导出失败：请先生成 deck 或手动填写 deck_id");
          return;
        }
        setRequestState("导出中...", "info");
        els.exportBtn.disabled = true;
        try {
          const body = await requestJson(`/api/v1/ppt/decks/${encodeURIComponent(deckId)}/export`, {
            method: "POST",
            body: JSON.stringify({}),
          });
          const data = body.data || {};
          const result = pickExport(data);
          state.exportResult = result;
          const parts = [];
          if (result?.path) parts.push(`<div>path: ${safeText(result.path)}</div>`);
          if (result?.url) parts.push(`<div>url: <a class="link" href="${safeText(result.url)}" target="_blank" rel="noreferrer">${safeText(result.url)}</a></div>`);
          els.exportInfo.innerHTML = parts.length
            ? parts.join("")
            : `<div>导出结果：<pre style="margin:6px 0 0; white-space:pre-wrap;">${escapeHtml(JSON.stringify(data, null, 2))}</pre></div>`;
          setRequestState("导出成功", "ok");
          log("导出成功", body);
        } catch (error) {
          setRequestState("导出失败", "error");
          log("导出失败", String(error.message || error));
        } finally {
          els.exportBtn.disabled = false;
          updateMeta();
        }
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      els.apiBase.addEventListener("change", syncLocalSettings);
      els.themeSelect.addEventListener("change", updateMeta);
      els.slidesLimit.addEventListener("input", updateMeta);
      els.deckId.addEventListener("input", () => {
        state.deckId = els.deckId.value.trim();
        updateMeta();
      });

      els.generateBtn.addEventListener("click", generateDeck);
      els.modifyBtn.addEventListener("click", modifyDeck);
      els.exportBtn.addEventListener("click", exportDeck);
      els.loginUrlBtn.addEventListener("click", getFeishuLoginUrl);
      els.openLoginBtn.addEventListener("click", openFeishuLogin);
      els.exchangeLoginBtn.addEventListener("click", exchangeFeishuCode);
      els.meBtn.addEventListener("click", loadCurrentUser);

      els.sourceText.value = `试验版多布局 PPT 联测材料
请优先覆盖这些新版结构：
1. 章节页 / section_divider：每个章节开头单独分页，标题要简短有力。
2. 金句页 / quote：用一句最能代表章节结论的话做强记忆点。
3. 流程页 / process：把步骤、阶段、输入输出串起来，适合 3-5 步。
4. 四象限 / matrix：用 2x2 结构表达优先级、分类或判断框架。
5. 架构模块 / architecture：拆成上中下或左右模块，展示系统、链路、组件关系。
6. 对比页 / comparison：并列比较两个方案、版本或策略，左右差异要一眼可见。
7. 指标页 / metrics：展示 3-4 个核心 KPI，数字要醒目。
8. 时间线 / timeline：按时间顺序写里程碑、交付节奏和截止日期。
要求：至少 8 页，尽量覆盖 section_divider、quote、process、matrix、architecture、comparison、metrics、timeline 这些结构差异。`;
      els.modifyText.value = "保留多布局结构，把封面更简洁，指标页更突出数字，时间线和风险对比更清晰，再补一页行动总结。";

      updateMeta();
      setPreview("");
      setRequestState("空闲", "info");
      loadThemes();
    </script>
  </body>
</html>
